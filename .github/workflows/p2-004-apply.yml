name: Apply P2-004 tracker and renderer patch

on:
  push:
    branches:
      - agent/p2-004-conversion-revalidation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-004-conversion-revalidation
          fetch-depth: 0

      - name: Apply renderer, page, and tracker updates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          renderer_path = Path("src/components/presence/sections/SectionRenderer.tsx")
          renderer = renderer_path.read_text()
          renderer = replace_once(
              renderer,
              "interface SectionRendererProps {",
              "export const CONVERSION_CTA_SECTION_TYPES = ['SERVICES', 'TESTIMONIALS', 'FAQ'] as const\n\ninterface SectionRendererProps {",
              "conversion types",
          )
          renderer = replace_once(
              renderer,
              "  const ctaSectionTypes = new Set(['SERVICES', 'FAQ'])",
              "  const ctaSectionTypes = new Set<string>(CONVERSION_CTA_SECTION_TYPES)",
              "CTA set",
          )
          renderer = replace_once(
              renderer,
              '    <div className="pb-24 md:pb-0" data-presence-root data-presence-template={premiumTemplateSlug}>',
              '    <div\n      className="pb-[calc(6rem+env(safe-area-inset-bottom))] md:pb-0"\n      data-presence-root\n      data-presence-template={premiumTemplateSlug}\n    >',
              "renderer padding",
          )
          renderer_path.write_text(renderer)

          page_path = Path("src/app/[handle]/page.tsx")
          page = replace_once(
              page_path.read_text(),
              '          className="min-h-screen overflow-x-clip pb-20 md:pb-0"',
              '          className="min-h-screen overflow-x-clip"',
              "page padding",
          )
          page_path.write_text(page)

          tracker_path = Path("docs/CRITICAL_ACTION_PLAN_PROGRESS.md")
          lines = tracker_path.read_text().splitlines()

          replacements = {
              "**Audit baseline:** `af1eefa`": "**Audit baseline:** `e91a08f`",
              "**Current working phase:** Phase 5 — Product Scope Discipline": "**Current working phase:** Phase 7 — Dashboard UX",
              "**Next planned item:** P2-003 — Merge the niche focus and run real-user sessions, then P2-010": "**Next planned item:** P2-010 — Clarify Draft vs Published State",
              "| Phase 5 — Product Scope Discipline                    |        2 |       1 |           0 |      3 |": "| Phase 5 — Product Scope Discipline                    |        3 |       0 |           0 |      3 |",
              "| **Total**                                             |   **40** |  **13** |       **8** | **61** |": "| **Total**                                             |   **41** |  **12** |       **8** | **61** |",
              "**Strict completion:** 40 of 61 items — approximately **66%**.  ": "**Strict completion:** 41 of 61 items — approximately **67%**.  ",
              "1. Merge the **P2-003** beauty-and-wellness niche focus, run its 3–5 real-user onboarding sessions, then complete **P2-010**. Continue the P2-001 fresh-user sessions as launch validation.": "1. Complete **P2-010**, **P2-011**, and **P2-012** to finish Phase 7. Continue the P2-001 and P2-003 real-user sessions as launch validation.",
              "2. Then complete **P2-011** and **P2-012** to finish Phase 7.": "2. Remove or clearly label the remaining fabricated homepage activity and testimonial claims under **P2-013** and **P2-016**.",
              "3. Remove or clearly label the remaining fabricated homepage activity and testimonial claims under **P2-013** and **P2-016**.": "3. Add public-page caching and measured load tests before growth work under Phase 9.",
              "4. Add public-page caching and measured load tests before growth work under Phase 9.": "4. Complete the remaining privacy, testing-maturity, and canonical architecture documentation gaps before paid scale.",
          }
          seen = set()
          for index, line in enumerate(lines):
              if line in replacements:
                  lines[index] = replacements[line]
                  seen.add(line)
          missing = set(replacements) - seen
          if missing:
              raise SystemExit(f"missing tracker lines: {sorted(missing)}")

          def replace_block(start_prefix: str, end_prefix: str, replacement: list[str]) -> None:
              start = next(i for i, line in enumerate(lines) if line.startswith(start_prefix))
              end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith(end_prefix))
              lines[start:end] = replacement + [""]

          replace_block("- [ ] **P2-003", "---", ['- [x] **P2-003 — Define the First Niche Clearly** — **Complete**', '  - Merged [PR #119](https://github.com/jonathan-hansel-awo/onprez/pull/119) selects independent beauty and wellness professionals and small teams as the first launch niche without restricting other supported service categories.', '  - Homepage hero copy, SEO metadata, signup metadata, and featured examples lead with hair, makeup, nails, massage, spas, salons, barbering, and mobile beauty.', '  - `docs/product/FIRST_LAUNCH_NICHE.md` defines the target user, problem, value proposition, product assumptions, realistic-demo standard, and a 3–5 participant onboarding protocol that includes at least one multi-member business.', '  - Heavenly Pamper Palace, Crown & Canvas Studio, and Regent Barber provide niche-specific demo and template evidence, while regression tests lock the intended audience and concrete presence-plus-booking journey.', '  - Genuine participant sessions remain ongoing launch validation and must not be fabricated, but the repository niche decision, product alignment, research protocol, examples, and regression acceptance criteria are complete in `main`.'])
          replace_block("- [x] **P2-004", "- [x] **P2-005", ['- [x] **P2-004 — Optimise Public Pages for Conversion, Not Just Beauty** — **Complete**', '  - Merged [PR #50](https://github.com/jonathan-hansel-awo/onprez/pull/50) delivered the sticky mobile CTA, clear service price/duration/live availability, genuine trust signals, direct booking routes, and repeated desktop conversion prompts.', '  - [PR #120](https://github.com/jonathan-hansel-awo/onprez/pull/120) revalidates the original acceptance criteria, makes persistent conversion controls theme-aware, reserves safe-area-aware mobile content space, and adds Testimonials to the high-intent desktop prompt points.', '  - `docs/product/PUBLIC_PAGE_CONVERSION_ACCEPTANCE.md` records the durable conversion contract and a repeatable manual comprehension check without fabricating participant results.', "  - Focused regression coverage protects genuine trust claims, direct hero/service/section/sticky booking links, accessible mobile touch height, safe-area behaviour, and the renderer's non-obstruction spacing."])

          separator = next(i for i, line in enumerate(lines) if line.startswith("| ------------") and i > 350)
          lines.insert(
              separator + 1,
              "| 31 July 2026 | Marked P2-003 complete after PR #119 merged and revalidated P2-004 conversion, safe-area, theme, documentation, and regression guarantees. | [#119](https://github.com/jonathan-hansel-awo/onprez/pull/119) / [#120](https://github.com/jonathan-hansel-awo/onprez/pull/120) |",
          )
          tracker_path.write_text("\n".join(lines) + "\n")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write "src/app/[handle]/page.tsx" "src/components/presence/PresenceConversion.tsx" "src/components/presence/sections/SectionRenderer.tsx" "__tests__/components/presence-conversion.test.tsx" "docs/product/PUBLIC_PAGE_CONVERSION_ACCEPTANCE.md" "docs/CRITICAL_ACTION_PLAN_PROGRESS.md"

      - name: Commit final patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p2-004-apply.yml
          git add "src/app/[handle]/page.tsx" "src/components/presence/PresenceConversion.tsx" "src/components/presence/sections/SectionRenderer.tsx" "__tests__/components/presence-conversion.test.tsx" "docs/product/PUBLIC_PAGE_CONVERSION_ACCEPTANCE.md" "docs/CRITICAL_ACTION_PLAN_PROGRESS.md"
          git commit -m "test: harden P2-004 conversion acceptance"
          git push
