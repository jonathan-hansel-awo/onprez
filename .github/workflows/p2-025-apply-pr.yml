name: Apply P2-025 from pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply and format P2-025
        shell: bash
        run: |
          cat .github/p2-025-payload.part.* | base64 -d | gzip -d > /tmp/apply-p2-025.py
          python /tmp/apply-p2-025.py
          npx prettier --write \
            src/lib/calendar/booking-calendar.ts \
            src/lib/integrations/google-calendar.ts \
            src/app/api/business/calendar/google/status/route.ts \
            src/app/api/business/calendar/google/connect/route.ts \
            src/app/api/business/calendar/google/callback/route.ts \
            src/app/api/business/calendar/google/disconnect/route.ts \
            src/app/dashboard/settings/calendar/page.tsx \
            src/app/dashboard/settings/page.tsx \
            src/lib/services/booking-notifications.ts \
            src/lib/services/email.ts \
            src/lib/services/appointment-state.ts \
            src/lib/services/booking.ts \
            __tests__/calendar/booking-calendar.test.ts \
            __tests__/notifications/booking-notifications.test.ts \
            .env.example
          rm -f \
            .github/workflows/p2-025-apply.yml \
            .github/workflows/p2-025-apply-pr.yml \
            .github/p2-025-trigger.txt \
            .github/p2-025-payload.b64 \
            .github/p2-025-payload.part.*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add calendar links and Google Calendar sync"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
