name: Core loop browser E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-loop:
    name: Core loop browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: onprez
          POSTGRES_DB: onprez_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U onprez -d onprez_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://onprez@127.0.0.1:5432/onprez_e2e
      DIRECT_URL: postgresql://onprez@127.0.0.1:5432/onprez_e2e
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_EXTERNAL_SERVER: 'true'
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: isolated-e2e
      CLOUDINARY_API_KEY: isolated-e2e
      CLOUDINARY_API_SECRET: isolated-e2e
      LOAD_TEST_DISABLE_EXTERNAL_SIDE_EFFECTS: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Create isolated runtime secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "EMAIL_VERIFICATION_TOKEN_PEPPER=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "RESEND_API_KEY=re_$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated database
        run: |
          npm run db:migrate:deploy
          npx prisma migrate diff \
            --from-url "$DIRECT_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Build production application
        run: npm run build

      - name: Start isolated application
        run: |
          mkdir -p artifacts/playwright
          npm run start -- -H 127.0.0.1 -p 3000 > artifacts/playwright/server.log 2>&1 &
          for attempt in {1..45}; do
            if curl --silent --fail --max-time 2 "$PLAYWRIGHT_BASE_URL/api/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 200 artifacts/playwright/server.log
          exit 1

      - name: Run launch-blocking core loop
        run: npm run test:e2e

      - name: Show application log on failure
        if: failure()
        run: tail -n 300 artifacts/playwright/server.log || true

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-loop-browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/playwright
          if-no-files-found: warn
          retention-days: 30
