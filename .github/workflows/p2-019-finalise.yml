name: P2-019 finalise branch

on:
  push:
    branches:
      - agent/p2-019-image-delivery-optimisation

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p2-019-image-delivery-optimisation
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Reconcile tracker and remove audit files
        run: |
          python <<'PY'
          from pathlib import Path
          tracker = Path('docs/CRITICAL_ACTION_PLAN_PROGRESS.md')
          source = tracker.read_text()
          replacements = {
            '**Last repository audit:** 31 July 2026': '**Last repository audit:** 1 August 2026',
            '**Audit baseline:** `455ad32`': '**Audit baseline:** `91bd954`',
            '**Next planned item:** P2-018 — Cache Public Presence Pages by Handle': '**Next planned item:** P2-019 — Optimise Image Delivery',
            '| Phase 9 — Performance and Scalability                 |        1 |       2 |           1 |      4 |': '| Phase 9 — Performance and Scalability                 |        2 |       1 |           1 |      4 |',
            '| **Total**                                             |   **47** |   **7** |       **7** | **61** |': '| **Total**                                             |   **48** |   **6** |       **7** | **61** |',
            '**Strict completion:** 47 of 61 items — approximately **77%**.': '**Strict completion:** 48 of 61 items — approximately **79%**.',
            '1. Merge and deploy **P2-018**, then add measured load tests under **P2-020**. Continue the P2-001 and P2-003 real-user sessions as launch validation.\n2. Optimise image delivery under **P2-019** and review cached public-page performance separately on mobile and desktop after major UI releases.': '1. Merge and deploy **P2-019**, then add measured load tests under **P2-020**. Continue the P2-001 and P2-003 real-user sessions as launch validation.\n2. Review cached public-page and image-delivery performance separately on mobile and desktop after major UI releases.',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Missing tracker text: {old}')
              source = source.replace(old, new)

          old_phase = '''- [ ] **P2-018 — Cache Public Presence Pages by Handle** — **Partial — implementation awaiting merge**
  - [PR #128](https://github.com/jonathan-hansel-awo/onprez/pull/128) replaces per-request public-route Prisma reads with one handle-scoped cache shared by page rendering and metadata.
  - The cache contains only published business fields, the protected published page snapshot, and published-review aggregates; services and next availability remain live through their public APIs.
  - A five-minute fallback lifetime is paired with immediate tag and rendered-route invalidation after publication, assisted live saves, profile/settings/branding/social updates, and theme changes.
  - Ordinary editor saves remain draft-only and do not invalidate or replace the customer-visible published snapshot.
  - `docs/product/PUBLIC_PRESENCE_CACHE_ACCEPTANCE.md` defines the cache identity, mutation matrix, privacy boundary, operational checks, and future invalidation rule.
  - Focused tests cover key construction, publication filtering, TTL, invalidation, assisted saves, publication changes, and architecture regressions.
  - Mark Complete after PR #128 merges successfully into `main`.

- [ ] **P2-019 — Optimise Image Delivery** — **Partial**
  - Cloudinary-backed uploads, image validation, sanitisation, scoped storage, format restrictions, and responsive frontend foundations exist.
  - Remaining: enforce upload-side resizing and quality policies, generate/serve responsive variants consistently, document delivery budgets, and test realistic galleries on slow mobile networks.'''
          new_phase = '''- [x] **P2-018 — Cache Public Presence Pages by Handle** — **Complete**
  - Merged [PR #128](https://github.com/jonathan-hansel-awo/onprez/pull/128) replaces per-request public-route Prisma reads with one handle-scoped cache shared by page rendering and metadata.
  - The cache contains only published business fields, the protected published page snapshot, and published-review aggregates; services and next availability remain live through their public APIs.
  - A five-minute fallback lifetime is paired with immediate tag and rendered-route invalidation after publication, assisted live saves, profile/settings/branding/social updates, and theme changes.
  - Ordinary editor saves remain draft-only and do not invalidate or replace the customer-visible published snapshot.
  - `docs/product/PUBLIC_PRESENCE_CACHE_ACCEPTANCE.md` defines the cache identity, mutation matrix, privacy boundary, operational checks, and future invalidation rule.
  - Focused tests cover key construction, publication filtering, TTL, invalidation, assisted saves, publication changes, and architecture regressions.

- [ ] **P2-019 — Optimise Image Delivery** — **Partial — implementation awaiting merge**
  - [PR #129](https://github.com/jonathan-hansel-awo/onprez/pull/129) enforces purpose-specific upload resizing and quality policies while retaining validation, metadata stripping, and scoped Cloudinary storage.
  - Original-byte SHA-256 fingerprints provide tenant- and purpose-scoped duplicate lookup before Sharp compression; matching assets are reused without another upload and concurrent duplicate races converge on the stored asset.
  - Dashboard and assisted-admin upload experiences explicitly notify the user when an existing image is reused.
  - Uploaded-image previews use responsive sizing without opting out of optimisation, and `docs/product/IMAGE_DELIVERY_ACCEPTANCE.md` defines delivery budgets and realistic slow-mobile gallery verification.
  - Focused tests cover fingerprints, resizing policies, duplicate bypass, deterministic upload IDs, notifications, and responsive preview delivery.
  - Mark Complete after PR #129 merges successfully into `main`.'''
          if old_phase not in source:
              raise SystemExit('Phase 9 tracker block did not match')
          tracker.write_text(source.replace(old_phase, new_phase))

          for item in [
              Path('__tests__/p2-019-repository-audit.test.ts'),
              Path('docs/p2-019-audit.json'),
              Path('docs/p2-019-test-audit.json'),
          ]:
              item.unlink(missing_ok=True)
          PY
      - name: Format final diff
        run: npx prettier --write src/app/api/upload/image/route.ts src/lib/uploads/image-security.ts src/lib/uploads/__tests__/image-optimization.test.ts src/components/ui/image-upload.tsx src/components/admin/AdminBusinessWorkspace.tsx __tests__/api/upload-image-deduplication.test.ts __tests__/p2-019-image-delivery-contract.test.ts docs/product/IMAGE_DELIVERY_ACCEPTANCE.md docs/CRITICAL_ACTION_PLAN_PROGRESS.md
      - name: Remove one-shot workflow
        run: rm .github/workflows/p2-019-finalise.yml
      - name: Commit final branch shape
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: finalise P2-019 acceptance and tracker"
          git push
