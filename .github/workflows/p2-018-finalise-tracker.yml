name: Finalise P2-018 tracker

on:
  push:
    branches:
      - agent/p2-018-public-presence-cache

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/p2-018-public-presence-cache
          fetch-depth: 0

      - name: Reconcile tracker
        run: python scripts/reconcile-p2-018-tracker.py

      - name: Remove temporary helpers
        run: |
          rm scripts/reconcile-p2-018-tracker.py
          rm .github/workflows/p2-018-finalise-tracker.yml

      - name: Commit final tracker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CRITICAL_ACTION_PLAN_PROGRESS.md scripts/reconcile-p2-018-tracker.py .github/workflows/p2-018-finalise-tracker.yml
          git commit -m 'docs: reconcile P2-017 and P2-018 progress'
          git push origin HEAD:agent/p2-018-public-presence-cache
