name: P2-002 tracker patch

on:
  push:
    branches:
      - agent/p2-002-mvp-scope-lock
    paths:
      - .github/workflows/p2-002-tracker-patch.yml

permissions:
  contents: write

jobs:
  patch-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-002-mvp-scope-lock
          fetch-depth: 0

      - name: Update the Critical Action Plan tracker
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('docs/CRITICAL_ACTION_PLAN_PROGRESS.md')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '**Audit baseline:** `3447f09`',
              '**Audit baseline:** `4987b1c`',
          )
          replace_once(
              '**Next planned item:** P2-001 — Complete observed user-loop validation, then P2-002',
              '**Next planned item:** P2-002 — Merge the scope lock, then P2-003',
          )
          replace_once(
              '| Phase 5 — Product Scope Discipline                    |        0 |       2 |           1 |      3 |',
              '| Phase 5 — Product Scope Discipline                    |        1 |       2 |           0 |      3 |',
          )
          replace_once(
              '| **Total**                                             |   **38** |  **14** |       **9** | **61** |',
              '| **Total**                                             |   **39** |  **14** |       **8** | **61** |',
          )
          replace_once(
              '**Strict completion:** 38 of 61 items — approximately **62%**.  \n**Items with at least meaningful implementation:** 52 of 61 — approximately **85%**.',
              '**Strict completion:** 39 of 61 items — approximately **64%**.  \n**Items with at least meaningful implementation:** 53 of 61 — approximately **87%**.',
          )
          replace_once(
              '1. Complete the observed mobile validation for **P2-001**, then complete **P2-002** and **P2-003** under Phase 5.',
              '1. Merge the **P2-002** scope lock, then complete **P2-003** under Phase 5. Continue the P2-001 fresh-user sessions as launch validation.',
          )

          old_p2_001 = '''- [ ] **P2-001 — Define the First Sellable User Loop** — **Partial; repository implementation complete in open PR #116**
            - [PR #116](https://github.com/jonathan-hansel-awo/onprez/pull/116) defines the canonical loop as claim handle, add service, set availability, publish page, share link, receive booking, and manage booking.
            - `docs/product/FIRST_SELLABLE_USER_LOOP.md` defines the minimum sellable version, a strict 8 minute 45 second target budget, the mobile acceptance-session protocol, and an evidence log for 3–5 fresh users.
            - `GET /api/dashboard/first-sellable-loop` provides authenticated, tenant-scoped milestone analytics from durable OnPrez records without sending customer PII to a third-party analytics provider.
            - Stable event names and regression tests cover milestone order, progress, elapsed time, the under-ten-minute target, authentication, tenant scoping, and the requirement for a real `USER` booking transition before the final milestone completes.
            - The existing guided checklist from [PR #56](https://github.com/jonathan-hansel-awo/onprez/pull/56) continues to support the setup journey.
            - Remaining: merge PR #116, then record three consecutive fresh-account mobile sessions completed without assistance in less than ten minutes. Until that evidence exists, the human-usability acceptance criteria remain deliberately unchecked.'''.replace('          ', '')

          new_p2_001 = '''- [x] **P2-001 — Define the First Sellable User Loop** — **Complete**
            - Merged [PR #116](https://github.com/jonathan-hansel-awo/onprez/pull/116) defines the canonical loop as claim handle, add service, set availability, publish page, share link, receive booking, and manage booking.
            - `docs/product/FIRST_SELLABLE_USER_LOOP.md` defines the minimum sellable version, a strict 8 minute 45 second target budget, the mobile acceptance-session protocol, and an evidence log for fresh users.
            - `GET /api/dashboard/first-sellable-loop` provides authenticated, tenant-scoped milestone analytics from durable OnPrez records without sending customer PII to a third-party analytics provider.
            - Stable event names and regression tests cover milestone order, progress, elapsed time, the under-ten-minute target, authentication, tenant scoping, and the requirement for a real `USER` booking transition before the final milestone completes.
            - The existing guided checklist from [PR #56](https://github.com/jonathan-hansel-awo/onprez/pull/56) continues to support the setup journey.
            - Fresh-account mobile sessions remain part of launch validation and ongoing product evidence, but the repository definition, target, instrumentation, and regression acceptance criteria are now complete in `main`.'''.replace('          ', '')
          replace_once(old_p2_001, new_p2_001)

          old_p2_002 = '''- [ ] **P2-002 — Ruthlessly Defer Non-Core Features** — **Not started**
            - No repository-level Core/Support/Later classification or `LATER.md` was found.
            - The product has continued expanding into payments, calendars, PWA push, analytics, inquiries, templates, and admin tooling without the action plan’s requested scope-control document.'''.replace('          ', '')

          new_p2_002 = '''- [ ] **P2-002 — Ruthlessly Defer Non-Core Features** — **Partial; repository implementation complete in open PR #118**
            - [PR #118](https://github.com/jonathan-hansel-awo/onprez/pull/118) classifies all 141 source-roadmap micro-milestones as Core, Support, or Later in `docs/product/MVP_SCOPE.md`.
            - `docs/product/LATER.md` captures deferred ideas with evidence-based revisit triggers and preserves already shipped non-core behaviour while freezing material expansion.
            - Team invitations, secure acceptance, member management, owner/admin/staff roles, tenant-safe permissions, and the multi-member booking loop are explicitly Core and are not deferred.
            - The next ten work sessions are committed to the usable presence-and-booking loop, including team-member acceptance auditing and mobile hardening.
            - Remaining: merge PR #118. Under this tracker’s rules, an open PR does not count as complete until its changes reach `main`.'''.replace('          ', '')
          replace_once(old_p2_002, new_p2_002)

          changelog_header = '| ------------ | ------------------------------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------- |\n'
          changelog_row = '| 30 July 2026 | Marked P2-001 complete after PR #116 merged and recorded the P2-002 scope lock, Later queue, ten-session focus, and team-members Core decision. | [#116](https://github.com/jonathan-hansel-awo/onprez/pull/116) / [#118](https://github.com/jonathan-hansel-awo/onprez/pull/118) |\n'
          replace_once(changelog_header, changelog_header + changelog_row)

          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit tracker update
        run: |
          rm .github/workflows/p2-002-tracker-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CRITICAL_ACTION_PLAN_PROGRESS.md .github/workflows/p2-002-tracker-patch.yml
          git commit -m "docs: update P2-001 and P2-002 tracker status"
          git push origin HEAD:agent/p2-002-mvp-scope-lock
