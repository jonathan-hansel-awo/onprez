name: Format push notification fix

on:
  push:
    branches:
      - agent/fix-pwa-booking-push-delivery

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/fix-pwa-booking-push-delivery

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/app/api/account/push-subscriptions/test/route.ts \
            src/components/pwa/push-diagnostics-card.tsx \
            src/lib/pwa/__tests__/push.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/account/push-subscriptions/test/route.ts \
            src/components/pwa/push-diagnostics-card.tsx \
            src/lib/pwa/__tests__/push.test.ts
          git commit -m "style: format push notification fix"
          git push
