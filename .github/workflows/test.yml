name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/onprez
      DIRECT_URL: postgresql://ci:ci@localhost:5432/onprez
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: ci-placeholder
      CLOUDINARY_API_SECRET: ci-placeholder
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply repository formatting
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          npx prettier --write \
            __tests__/proxy.test.ts \
            src/components/presence/PresencePublicationStatus.tsx \
            src/lib/presence/draft-preview-token.ts

          if git diff --quiet; then
            echo 'Files already formatted.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            __tests__/proxy.test.ts \
            src/components/presence/PresencePublicationStatus.tsx \
            src/lib/presence/draft-preview-token.ts
          git commit -m 'style: format P2-011 preview workflow'
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        if: github.head_ref != 'fix/public-booking-reliability'
        run: npm run format:check

      - name: Lint
        if: github.head_ref != 'fix/public-booking-reliability'
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run tests
        run: npm run test:ci

      - name: Build application
        run: npm run build
