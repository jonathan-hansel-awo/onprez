name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/onprez
      DIRECT_URL: postgresql://ci:ci@localhost:5432/onprez
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: ci-placeholder
      CLOUDINARY_API_SECRET: ci-placeholder
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply exact Prettier formatting and restore CI files
        run: |
          npx prettier --write \
            docs/CRITICAL_ACTION_PLAN_PROGRESS.md \
            docs/product/FIRST_LAUNCH_NICHE.md \
            docs/product/LATER.md \
            docs/product/MVP_SCOPE.md

          git fetch origin main
          git show origin/main:package.json > package.json
          git show origin/main:.github/workflows/test.yml > .github/workflows/test.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/CRITICAL_ACTION_PLAN_PROGRESS.md \
            docs/product/FIRST_LAUNCH_NICHE.md \
            docs/product/LATER.md \
            docs/product/MVP_SCOPE.md \
            package.json \
            .github/workflows/test.yml
          git commit -m "style: format P2-002 and P2-003 documentation"
          git push origin HEAD:${{ github.head_ref }}
