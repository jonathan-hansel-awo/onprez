name: Format P2-001 progress tracker

on:
  push:
    branches:
      - agent/p2-001-quality-gate-fix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/p2-001-quality-gate-fix

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format progress tracker
        run: npx prettier --write docs/CRITICAL_ACTION_PLAN_PROGRESS.md

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CRITICAL_ACTION_PLAN_PROGRESS.md
          git commit -m "style: format P2-001 progress tracker"
          git push
