name: Finalise P2-025 calendar integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/onprez
      DIRECT_URL: postgresql://ci:ci@localhost:5432/onprez
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: ci-placeholder
      CLOUDINARY_API_SECRET: ci-placeholder
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      GOOGLE_CALENDAR_CLIENT_ID: ci-google-client
      GOOGLE_CALENDAR_CLIENT_SECRET: ci-google-secret
      GOOGLE_CALENDAR_TOKEN_ENCRYPTION_KEY: ci-google-calendar-token-key-at-least-32-characters

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          calendar_page = Path('src/app/dashboard/settings/calendar/page.tsx')
          source = calendar_page.read_text()
          source = source.replace('variant="danger"', 'variant="destructive"')
          calendar_page.write_text(source)

          booking = Path('src/lib/services/booking.ts')
          source = booking.read_text()
          old = '''        business: {
          select: {
            name: true,
            email: true,
            phone: true,
            timezone: true,
          },
        },
      },
    })

    const rescheduledAt = updatedAppointment.rescheduledAt || new Date()'''
          new = '''        business: {
          select: {
            name: true,
            email: true,
            phone: true,
            address: true,
            timezone: true,
          },
        },
      },
    })

    const rescheduledAt = updatedAppointment.rescheduledAt || new Date()'''
          if old not in source:
              raise RuntimeError('Reschedule business select block was not found')
          booking.write_text(source.replace(old, new, 1))
          PY
          npx prettier --write src/app/dashboard/settings/calendar/page.tsx src/lib/services/booking.ts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run tests
        run: npm run test:ci

      - name: Build application
        run: npm run build

      - name: Commit verified fixes
        run: |
          rm -f .github/workflows/p2-025-verify-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalise calendar integration quality gates"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
