name: P2-019 caller helper

on:
  push:
    branches:
      - agent/p2-019-image-delivery-optimisation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p2-019-image-delivery-optimisation
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch assisted-admin notification and test inventory
        run: |
          python <<'PY'
          from pathlib import Path
          workspace = Path('src/components/admin/AdminBusinessWorkspace.tsx')
          source = workspace.read_text()
          old = "      setServiceMessage('Image uploaded. Save the service to keep it.')"
          new = """      setServiceMessage(
            result.data.reused === true
              ? result.message ||
                  'This image was already in the business media library, so the stored copy was reused.'
              : result.message || 'Image uploaded. Save the service to keep it.'
          )"""
          if old not in source:
              raise SystemExit('Expected assisted-admin upload message was not found')
          workspace.write_text(source.replace(old, new))

          roots = [Path('__tests__'), Path('src')]
          matches = []
          for root in roots:
              for file in root.rglob('*'):
                  if file.suffix not in {'.ts', '.tsx'}:
                      continue
                  text = file.read_text(errors='ignore')
                  if 'sanitizeImageUpload' in text or "api/upload/image/route" in text:
                      matches.append(str(file))
          Path('docs/p2-019-test-audit.json').write_text(__import__('json').dumps(sorted(matches), indent=2) + '\n')
          PY
      - name: Format touched files
        run: npx prettier --write src/components/admin/AdminBusinessWorkspace.tsx src/components/ui/image-upload.tsx src/app/api/upload/image/route.ts src/lib/uploads/image-security.ts docs/p2-019-test-audit.json
      - name: Remove one-shot workflow
        run: rm .github/workflows/p2-019-caller-helper.yml
      - name: Commit helper result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(images): surface duplicate reuse across upload callers"
          git push
