name: P2-005 format booking demo

on:
  push:
    branches:
      - agent/p2-005-realistic-demo-revalidation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p2-005-realistic-demo-revalidation
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Format the remaining booking-demo test
        run: npx prettier --write src/components/templates/__tests__/RealisticDemoBookingJourney.test.tsx

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/p2-005-format-booking-demo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/templates/__tests__/RealisticDemoBookingJourney.test.tsx .github/workflows/p2-005-format-booking-demo.yml
          git commit -m "style: format catalogue booking demo test"
          git push origin HEAD:agent/p2-005-realistic-demo-revalidation
