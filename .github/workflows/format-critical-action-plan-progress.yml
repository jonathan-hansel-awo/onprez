name: Format Critical Action Plan Progress

on:
  push:
    branches:
      - docs/critical-action-plan-progress
    paths:
      - docs/CRITICAL_ACTION_PLAN_PROGRESS.md
      - .github/workflows/format-critical-action-plan-progress.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/critical-action-plan-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Format tracker
        run: npx prettier --write docs/CRITICAL_ACTION_PLAN_PROGRESS.md

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CRITICAL_ACTION_PLAN_PROGRESS.md
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format Critical Action Plan progress tracker"
          git push
