name: Format P2-001 quality fix

on:
  push:
    branches:
      - agent/p2-001-quality-gate-fix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/p2-001-quality-gate-fix

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format P2-001 files
        run: |
          npx prettier --write \
            __tests__/api/first-sellable-loop.test.ts \
            docs/product/FIRST_SELLABLE_USER_LOOP.md \
            src/app/api/dashboard/first-sellable-loop/route.ts \
            src/lib/product/first-sellable-loop.test.ts \
            src/lib/product/first-sellable-loop.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            __tests__/api/first-sellable-loop.test.ts \
            docs/product/FIRST_SELLABLE_USER_LOOP.md \
            src/app/api/dashboard/first-sellable-loop/route.ts \
            src/lib/product/first-sellable-loop.test.ts \
            src/lib/product/first-sellable-loop.ts
          git commit -m "style: format P2-001 implementation"
          git push
