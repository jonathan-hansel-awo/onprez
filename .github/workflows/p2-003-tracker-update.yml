name: P2-003 tracker update

on:
  push:
    branches:
      - agent/p2-003-first-beauty-wellness-niche
    paths:
      - .github/workflows/p2-003-tracker-update.yml

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p2-003-first-beauty-wellness-niche
          fetch-depth: 0

      - name: Update Critical Action Plan tracker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/CRITICAL_ACTION_PLAN_PROGRESS.md')
          text = path.read_text()

          replacements = {
              '**Last repository audit:** 30 July 2026': '**Last repository audit:** 31 July 2026',
              '**Audit baseline:** `4987b1c`': '**Audit baseline:** `af1eefa`',
              '**Next planned item:** P2-002 — Merge the scope lock, then P2-003': '**Next planned item:** P2-003 — Merge the niche focus and run real-user sessions, then P2-010',
              '| Phase 5 — Product Scope Discipline                    |        1 |       2 |           0 |      3 |': '| Phase 5 — Product Scope Discipline                    |        2 |       1 |           0 |      3 |',
              '| **Total**                                             |   **39** |  **14** |       **8** | **61** |': '| **Total**                                             |   **40** |  **13** |       **8** | **61** |',
              '**Strict completion:** 39 of 61 items — approximately **64%**.': '**Strict completion:** 40 of 61 items — approximately **66%**.',
              '1. Merge the **P2-002** scope lock, then complete **P2-003** under Phase 5. Continue the P2-001 fresh-user sessions as launch validation.': '1. Merge the **P2-003** beauty-and-wellness niche focus, run its 3–5 real-user onboarding sessions, then complete **P2-010**. Continue the P2-001 fresh-user sessions as launch validation.',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected tracker text: {old}')
              text = text.replace(old, new, 1)

          old_p2_002 = '''- [ ] **P2-002 — Ruthlessly Defer Non-Core Features** — **Partial; repository implementation complete in open PR #118**
            - [PR #118](https://github.com/jonathan-hansel-awo/onprez/pull/118) classifies all 141 source-roadmap micro-milestones as Core, Support, or Later in `docs/product/MVP_SCOPE.md`.
            - `docs/product/LATER.md` captures deferred ideas with evidence-based revisit triggers and preserves already shipped non-core behaviour while freezing material expansion.
            - Team invitations, secure acceptance, member management, owner/admin/staff roles, tenant-safe permissions, and the multi-member booking loop are explicitly Core and are not deferred.
            - The next ten work sessions are committed to the usable presence-and-booking loop, including team-member acceptance auditing and mobile hardening.
            - Remaining: merge PR #118. Under this tracker’s rules, an open PR does not count as complete until its changes reach `main`.
          '''
          new_p2_002 = '''- [x] **P2-002 — Ruthlessly Defer Non-Core Features** — **Complete**
            - Merged [PR #118](https://github.com/jonathan-hansel-awo/onprez/pull/118) classifies all 141 source-roadmap micro-milestones as Core, Support, or Later in `docs/product/MVP_SCOPE.md`.
            - `docs/product/LATER.md` captures deferred ideas with evidence-based revisit triggers and preserves already shipped non-core behaviour while freezing material expansion.
            - Team invitations, secure acceptance, member management, owner/admin/staff roles, tenant-safe permissions, and the multi-member booking loop are explicitly Core and are not deferred.
            - The next ten work sessions are committed to the usable presence-and-booking loop, including team-member acceptance auditing and mobile hardening.
          '''
          old_p2_002 = old_p2_002.replace('          ', '')
          new_p2_002 = new_p2_002.replace('          ', '')
          if old_p2_002 not in text:
              raise SystemExit('Missing expected P2-002 block')
          text = text.replace(old_p2_002, new_p2_002, 1)

          old_p2_003 = '''- [ ] **P2-003 — Define the First Niche Clearly** — **Partial**
          - Realistic beauty, wellness, barber, therapy, fitness, professional, creative, and education examples now exist.
          - The homepage still positions OnPrez broadly for service professionals rather than committing to one initial niche.
          - Remaining: select one first niche, align primary homepage/onboarding copy to it, and document 3–5 observed onboarding sessions with real professionals from that niche.
          '''.replace('          ', '')
          new_p2_003 = '''- [ ] **P2-003 — Define the First Niche Clearly** — **Partial; repository implementation complete in open PR #119**
          - [PR #119](https://github.com/jonathan-hansel-awo/onprez/pull/119) selects independent beauty and wellness professionals and small teams as the first launch niche without restricting other supported service categories.
          - Homepage hero copy, SEO metadata, signup metadata, and featured examples now lead with hair, makeup, nails, massage, spas, salons, barbering, and mobile beauty.
          - `docs/product/FIRST_LAUNCH_NICHE.md` defines the target user, problem, value proposition, product assumptions, realistic-demo standard, and a 3–5 participant onboarding protocol that includes at least one multi-member business.
          - Heavenly Pamper Palace, Crown & Canvas Studio, and Regent Barber provide niche-specific demo and template evidence, while regression tests lock the intended audience and concrete presence-plus-booking journey.
          - Remaining: merge PR #119 and record the real-participant sessions. Real-user evidence is deliberately not fabricated in the repository.
          '''.replace('          ', '')
          if old_p2_003 not in text:
              raise SystemExit('Missing expected P2-003 block')
          text = text.replace(old_p2_003, new_p2_003, 1)

          changelog_header = '''| Date         | Change                                                                                                                                                           | PR                                                                                                                              |
          | ------------ | ---------------------------------------------------------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------- |
          '''.replace('          ', '')
          changelog_row = '''| 31 July 2026 | Marked P2-002 complete after PR #118 merged and recorded the P2-003 beauty-and-wellness niche decision, product copy, demos, tests, and real-user validation protocol. | [#118](https://github.com/jonathan-hansel-awo/onprez/pull/118) / [#119](https://github.com/jonathan-hansel-awo/onprez/pull/119) |
          '''.replace('          ', '')
          if changelog_header not in text:
              raise SystemExit('Missing change-log header')
          text = text.replace(changelog_header, changelog_header + changelog_row, 1)

          path.write_text(text)
          PY

          rm .github/workflows/p2-003-tracker-update.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CRITICAL_ACTION_PLAN_PROGRESS.md .github/workflows/p2-003-tracker-update.yml
          git commit -m "docs: update P2-002 and P2-003 tracker status"
          git push origin HEAD:agent/p2-003-first-beauty-wellness-niche
