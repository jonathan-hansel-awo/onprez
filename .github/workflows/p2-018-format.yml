name: Format P2-018 files

on:
  push:
    branches:
      - agent/p2-018-public-presence-cache

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/p2-018-public-presence-cache
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write docs/product/PUBLIC_PRESENCE_CACHE_ACCEPTANCE.md src/lib/presence/__tests__/public-presence-cache.test.ts

      - name: Remove temporary workflow
        run: rm .github/workflows/p2-018-format.yml

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product/PUBLIC_PRESENCE_CACHE_ACCEPTANCE.md src/lib/presence/__tests__/public-presence-cache.test.ts .github/workflows/p2-018-format.yml
          git commit -m 'style: format P2-018 cache files'
          git push origin HEAD:agent/p2-018-public-presence-cache
