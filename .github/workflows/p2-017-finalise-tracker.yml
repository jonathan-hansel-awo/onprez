name: Finalise P2-017 tracker

on:
  push:
    branches:
      - agent/p2-017-web-vitals-monitoring

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/p2-017-web-vitals-monitoring
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile and format tracker
        run: |
          python scripts/reconcile-p2-017-tracker.py
          npx prettier --write docs/CRITICAL_ACTION_PLAN_PROGRESS.md

      - name: Remove temporary helpers
        run: |
          git checkout origin/main -- package.json
          rm scripts/reconcile-p2-017-tracker.py
          rm .github/workflows/p2-017-finalise-tracker.yml

      - name: Commit final tracker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CRITICAL_ACTION_PLAN_PROGRESS.md package.json scripts/reconcile-p2-017-tracker.py .github/workflows/p2-017-finalise-tracker.yml
          git commit -m 'docs: reconcile merged action-plan progress'
          git push origin HEAD:agent/p2-017-web-vitals-monitoring
