name: Temporary pricing formatter

on:
  push:
    branches:
      - feat/pricing-plans-page

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/landing/feature-comparison.tsx src/components/landing/value-calculator.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-pricing-files
          path: |
            src/components/landing/feature-comparison.tsx
            src/components/landing/value-calculator.tsx
