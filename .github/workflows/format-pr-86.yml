name: Format PR 86

on:
  push:
    branches:
      - fix/admin-presence-content-and-media

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/admin-presence-content-and-media
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format flagged file
        run: npx prettier --write src/components/presence/editor/sections/ServicesSectionEditor.tsx

      - name: Remove temporary formatter workflow
        run: rm .github/workflows/format-pr-86.yml

      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/presence/editor/sections/ServicesSectionEditor.tsx .github/workflows/format-pr-86.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: apply repository Prettier formatting"
          git push origin HEAD:fix/admin-presence-content-and-media
