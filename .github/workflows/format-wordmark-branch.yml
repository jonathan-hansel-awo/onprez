name: Format wordmark branch

on:
  push:
    branches:
      - agent/use-wordmark-brand-assets

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format changed files
        run: npx prettier --write public/offline.html src/app/api/pwa/icon/route.tsx

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/offline.html src/app/api/pwa/icon/route.tsx

          if git diff --cached --quiet; then
            echo "Files are already formatted."
            exit 0
          fi

          git commit -m "style: format wordmark branding files"
          git push
