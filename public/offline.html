<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>OnPrez is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f7f7ff;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 10%, rgb(37 99 235 / 14%), transparent 34rem),
          radial-gradient(circle at 85% 90%, rgb(124 58 237 / 14%), transparent 34rem), #f7f7ff;
      }

      main {
        width: min(100%, 520px);
        padding: clamp(28px, 7vw, 48px);
        border: 1px solid rgb(37 99 235 / 14%);
        border-radius: 24px;
        background: rgb(255 255 255 / 92%);
        box-shadow: 0 24px 70px rgb(23 32 51 / 12%);
        text-align: center;
      }

      .wordmark {
        display: block;
        width: min(100%, 250px);
        height: auto;
        margin: 0 auto 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 7vw, 2.35rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 14px auto 0;
        max-width: 36ch;
        color: #526079;
        font-size: 1rem;
        line-height: 1.65;
      }

      button {
        min-height: 48px;
        margin-top: 28px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid rgb(37 99 235 / 35%);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="wordmark" src="/onprez-wordmark.svg" alt="OnPrez" width="616" height="176" />
      <h1>You’re currently offline</h1>
      <p>
        OnPrez needs an internet connection to show current bookings and customer information. No
        private dashboard data has been stored for offline use.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
